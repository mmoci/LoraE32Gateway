; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Ilib
    -Ilib/E32LoraModule
    -Ilib/LoraGatewayBridge
    -Ilib/MqttClient
    -Ilib/Logger
    -Ilib/OtaHandler
    -D MQTT_MAX_PACKET_SIZE=512
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson @ ^7.0.0

[env:esp32dev-ota]
; OTA upload environment — use this instead of esp32dev once the gateway
; is deployed and you can no longer reach it via USB.
; Requires the gateway to already be running firmware with OtaHandler enabled.
extends          = env:esp32dev
upload_protocol  = espota
upload_port      = 192.168.1.9  ; or use the lora-gateway.local
upload_flags     = --auth=${sysenv.OTA_PASSWORD}
